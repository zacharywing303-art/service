version: "3.9"

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openfsm_test
      POSTGRES_PASSWORD: openfsm_test
      POSTGRES_DB: openfsm_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfsm_test"]
      interval: 2s
      timeout: 2s
      retries: 10
