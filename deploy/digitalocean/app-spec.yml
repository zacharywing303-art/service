name: openfsm
region: nyc
databases:
  - engine: PG
    name: openfsm-db
    num_nodes: 1
    size: db-s-1vcpu-1gb
    version: "16"
services:
  - name: api
    image:
      registry_type: DOCR
      repository: openfsm-api
      tag: latest
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4000
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${openfsm-db.DATABASE_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
    health_check:
      http_path: /healthz
    routes:
      - path: /api
  - name: web
    image:
      registry_type: DOCR
      repository: openfsm-web
      tag: latest
    instance_size_slug: basic-xxs
    http_port: 80
    routes:
      - path: /
  - name: worker
    image:
      registry_type: DOCR
      repository: openfsm-worker
      tag: latest
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${openfsm-db.DATABASE_URL}
