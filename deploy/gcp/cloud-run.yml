apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: openfsm-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/openfsm/api:latest
          ports:
            - containerPort: 4000
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /healthz
              port: 4000
