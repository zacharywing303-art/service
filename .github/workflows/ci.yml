name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openfsm_test
          POSTGRES_PASSWORD: openfsm_test
          POSTGRES_DB: openfsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfsm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openfsm_test:openfsm_test@localhost:5432/openfsm_test
      SESSION_SECRET: test-session-secret
      PORTAL_JWT_SECRET: test-portal-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push images
        run: |
          for svc in api web site portal worker; do
            docker build -t ghcr.io/${{ github.repository }}/$svc:${{ github.sha }} \
                         -t ghcr.io/${{ github.repository }}/$svc:latest \
                         -f Dockerfile.$svc .
            docker push ghcr.io/${{ github.repository }}/$svc --all-tags
          done
